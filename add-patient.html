<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Patient | Hospital Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar"><h1>Hospital Management</h1><div class="topbar-right"><span>Admin</span><div class="avatar">A</div></div></header>
      <nav class="menu"><a href="DashBoard.html">Dashboard</a><a href="patients.html" class="active">Patients</a><a href="doctors.html">Doctors</a><a href="appointments.html">Appointments</a><a href="billing.html">Billing</a></nav>
      <main>
        <div class="page-heading"><div><h2>Add Patient</h2><p>Create a new patient record.</p></div><a class="button secondary-button" href="patients.html">Back to patients</a></div>
        <form class="invoice-form" action="patients.html" method="get">
          <section class="panel form-section">
            <h3>Patient details</h3>
            <div class="form-grid">
              <label>First name<input type="text" name="first-name" required /></label>
              <label>Last name<input type="text" name="last-name" required /></label>
              <label>Date of birth<input type="date" name="date-of-birth" required /></label>
              <label>Phone number<input type="tel" name="phone" required /></label>
              <label>Email address<input type="email" name="email" /></label>
              <label>Department<select name="department" required><option value="">Select department</option><option>Cardiology</option><option>Neurology</option><option>Pediatrics</option><option>Orthopedic</option></select></label>
            </div>
            <label class="notes-field">Address<textarea name="address" rows="3" placeholder="Enter the patient's address"></textarea></label>
          </section>
          <div class="form-actions"><a class="button secondary-button" href="patients.html">Cancel</a><button class="button" type="submit">Add patient</button></div>
        </form>
      </main>
    </div>
  </body>
</html>
