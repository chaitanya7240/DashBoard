<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Invoice | Hospital Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <h1>Hospital Management</h1>
        <div class="topbar-right"><span>Admin</span><div class="avatar">A</div></div>
      </header>
      <nav class="menu">
        <a href="DashBoard.html" target="_blank">Dashboard</a>
        <a href="patients.html" target="_blank">Patients</a>
        <a href="doctors.html" target="_blank">Doctors</a>
        <a href="appointments.html" target="_blank">Appointments</a>
        <a href="billing.html" class="active">Billing</a>
      </nav>
      <main>
        <div class="page-heading">
          <div><h2>Create Invoice</h2><p>Prepare a new invoice for a patient.</p></div>
          <a class="button secondary-button" href="billing.html">Back to billing</a>
        </div>
        <form class="invoice-form" action="billing.html" method="get">
          <section class="panel form-section">
            <h3>Invoice details</h3>
            <div class="form-grid">
              <label>Patient<select name="patient" required><option value="">Select patient</option><option>John Doe</option><option>Emma Smith</option><option>Mike Ross</option><option>Anna Lee</option></select></label>
              <label>Invoice date<input type="date" name="date" required /></label>
              <label>Service<input type="text" name="service" placeholder="e.g. Cardiology consultation" required /></label>
              <label>Due date<input type="date" name="due-date" required /></label>
              <label>Amount ($)<input type="number" name="amount" min="0" step="0.01" placeholder="0.00" required /></label>
              <label>Status<select name="status"><option>Pending</option><option>Paid</option></select></label>
            </div>
            <label class="notes-field">Notes<textarea name="notes" rows="4" placeholder="Add billing notes or payment instructions"></textarea></label>
          </section>
          <div class="form-actions">
            <a class="button secondary-button" href="billing.html">Cancel</a>
            <button class="button" type="submit">Create invoice</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
